<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="suction-force-diagram-title suction-force-diagram-desc" id="suction_force_diagram-root">
  <title id="suction-force-diagram-title">Suction retention — one cup, one cube</title>
  <desc id="suction-force-diagram-desc">Top-pickup side view showing suction, gravity, inertia, contact forces, eccentricity and seal-edge pivot, with model safety factors for top pickup and the governing side-pickup case.</desc>
  <defs>
      <style>#suction_force_diagram-root { color: #2d3142; }
      #suction_force_diagram-root .diagram-container { width: 100%; overflow-x: auto; }
      #suction_force_diagram-root .label { font-family: 'Geist', 'Helvetica Neue', Arial, sans-serif; font-size: 16px; font-weight: 600; fill: #2d3142; }
      #suction_force_diagram-root .detail { font-family: 'Geist Mono', Menlo, monospace; font-size: 12px; fill: #4f5d75; }
      #suction_force_diagram-root .stat { font-family: 'Geist', 'Helvetica Neue', Arial, sans-serif; font-size: 28px; font-weight: 600; font-variant-numeric: lining-nums tabular-nums; letter-spacing: -0.01em; fill: #2d3142; }
      #suction_force_diagram-root .heading { font-family: 'Instrument Serif', Georgia, serif; font-size: 28px; font-weight: 400; fill: #2d3142; }
      #suction_force_diagram-root .force { fill: none; stroke: #2d3142; stroke-width: 2; marker-end: url(#suction_force_diagram-force-arrow); }
      #suction_force_diagram-root .dimension { fill: none; stroke: #4f5d75; stroke-width: 1; marker-start: url(#suction_force_diagram-dimension-arrow); marker-end: url(#suction_force_diagram-dimension-arrow); }
      #suction_force_diagram-root .guide { fill: none; stroke: #4f5d75; stroke-width: 1; stroke-dasharray: 4 4; }
      #suction_force_diagram-root .leader { fill: none; stroke: #4f5d75; stroke-width: 1.2; }
      @media print {
#suction_force_diagram-root .diagram-container { overflow-x: visible; }
}</style>
    <marker id="suction_force_diagram-force-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#2d3142"/></marker>
    <marker id="suction_force_diagram-suction-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#bf4520"/></marker>
    <marker id="suction_force_diagram-dimension-arrow" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M6 0 L0 3 L6 6" fill="none" stroke="#4f5d75" stroke-width="1"/></marker>
  </defs>
  <rect width="960" height="720" fill="#f5f5f5"/>
  <text x="40" y="44" class="eyebrow">RETENTION CHECK · ONE CUP / ONE CUBE</text>
  <text x="40" y="80" class="heading">Acceleration and off-center pickup</text>

  <!-- Side view: 200 mm is 320 drawing units; e = 50 mm, h = 100 mm. -->
  <rect x="200" y="248" width="320" height="320" rx="6" fill="#ececec" stroke="#2d3142" stroke-width="1.6"/>
  <path d="M248 196 H312 L344 248 H216 Z" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.6"/>
  <line x1="216" y1="248" x2="344" y2="248" stroke="#2d3142" stroke-width="3"/>
  <path d="M360 184 V400 M368 408 H580" class="guide"/>

  <!-- e is the cup-center to COM-projection offset; h is normal to the face. -->
  <line x1="280" y1="184" x2="360" y2="184" class="dimension"/>
  <rect x="308" y="148" width="24" height="24" fill="#f5f5f5"/>
  <text x="320" y="166" text-anchor="middle" class="label">e</text>
  <path d="M528 248 H580" class="leader"/>
  <line x1="572" y1="248" x2="572" y2="408" class="dimension"/>
  <rect x="584" y="312" width="24" height="28" fill="#f5f5f5"/>
  <text x="596" y="332" text-anchor="middle" class="label">h</text>

  <!-- Forces on the cube in the accelerating robot frame. -->
  <line x1="280" y1="248" x2="280" y2="108" stroke="#bf4520" stroke-width="2.8" marker-end="url(#suction_force_diagram-suction-arrow)"/>
  <rect x="292" y="104" width="116" height="24" fill="#f5f5f5"/>
  <text x="300" y="122" class="label" style="fill:#bf4520">F_suction</text>
  <line x1="360" y1="408" x2="360" y2="532" class="force"/>
  <rect x="372" y="480" width="40" height="28" fill="#ececec"/>
  <text x="380" y="500" class="label">mg</text>
  <line x1="360" y1="408" x2="76" y2="408" class="force" stroke-dasharray="7 5"/>
  <rect x="68" y="368" width="64" height="28" fill="#f5f5f5"/>
  <text x="76" y="388" class="label">m·a</text>
  <line x1="280" y1="248" x2="448" y2="248" class="force"/>
  <rect x="380" y="208" width="128" height="28" fill="#f5f5f5"/>
  <text x="388" y="228" class="label">f_contact</text>
  <line x1="232" y1="248" x2="232" y2="332" class="force"/>
  <rect x="92" y="304" width="104" height="28" fill="#f5f5f5"/>
  <text x="188" y="324" text-anchor="end" class="label">R_edge</text>
  <circle cx="360" cy="408" r="5" fill="#2d3142"/>
  <text x="376" y="396" class="detail">COM</text>
  <text x="404" y="544" class="detail">700 g cube</text>

  <text x="40" y="180" class="label">Ø80 mm cup</text>
  <text x="40" y="200" class="detail">−85 kPa</text>
  <path d="M164 188 H192 Q200 188 200 196 V216 Q200 224 208 224 H228" class="leader"/>
  <text x="40" y="260" class="label">Seal-edge pivot</text>
  <path d="M176 272 H216 Q224 272 224 264 V256" class="leader"/>
  <circle cx="232" cy="248" r="5" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.6"/>
  <text x="40" y="460" class="detail">Top pickup (C)</text>
  <text x="40" y="480" class="detail">Robot frame</text>

  <path d="M200 576 V608 M520 576 V608" class="leader"/>
  <line x1="200" y1="600" x2="520" y2="600" class="dimension"/>
  <rect x="312" y="608" width="96" height="24" fill="#f5f5f5"/>
  <text x="360" y="626" text-anchor="middle" class="detail">200 mm</text>

  <!-- Model results remain separate from the pictured top-pickup case. -->
  <rect x="632" y="112" width="288" height="488" rx="6" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1"/>
  <text x="656" y="144" class="label">Model check · per cup</text>
  <text x="656" y="188" class="stat">427 N</text>
  <text x="656" y="212" class="detail">Theoretical suction: ΔP·A</text>
  <line x1="656" y1="232" x2="896" y2="232" stroke="#bfc0c0" stroke-width="1"/>
  <text x="656" y="260" class="detail">F_model = 120.17 N</text>
  <text x="656" y="280" class="detail">d_eff = 60 mm · η = 0.50</text>
  <text x="656" y="300" class="detail">e = 50 mm · h = 100 mm</text>
  <text x="656" y="328" class="label">Acceleration cases</text>
  <text x="656" y="352" class="detail">1.24 m/s² · average</text>
  <text x="656" y="376" class="detail">7.85 m/s² · assumed</text>
  <text x="656" y="394" class="detail">traction upper bound</text>
  <line x1="656" y1="412" x2="896" y2="412" stroke="#bfc0c0" stroke-width="1"/>
  <text x="656" y="440" class="label">Minimum model safety factor</text>
  <text x="656" y="462" class="detail">Side pickup governs (A)</text>
  <text x="656" y="502" class="stat">4.77</text>
  <text x="792" y="502" class="stat" style="fill:#bf4520">3.20</text>
  <text x="656" y="522" class="detail">Average</text>
  <text x="792" y="522" class="detail">Upper bound</text>
  <text x="656" y="560" class="detail">Top pickup shown (C):</text>
  <text x="656" y="580" class="detail">S_peel = 3.28 at 7.85 m/s²</text>

  <line x1="40" y1="652" x2="920" y2="652" stroke="#bfc0c0" stroke-width="1"/>
  <text x="40" y="680" class="detail">M_edge = mg(R + e) + (m·a)h</text>
  <text x="464" y="680" class="detail">S_peel = F_model·R / M_edge · R = 30 mm</text>
</svg>
